<!DOCTYPE html>
<html lang="ru" data-theme="magnit">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Купон — Магнит Плюс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="magnit"] {
  --bg: #f3f4f7; --surface: #ffffff; --surface-2: #f6f7f9; --surface-3: #eceef2;
  --text: #1a1a1a; --muted: #7b7f89; --line: #e7e8ed; --line-2: #d5d7df;
  --brand: #e4002b; --brand-2: #ff2447; --on-brand: #ffffff; --brand-soft: rgba(228,0,43,.08);
  --good: #2fd17c; --good-soft: rgba(47,209,124,.1); --warn: #e08a00;
  --plate: linear-gradient(135deg, #e4002b, #ff2d4f);
  --shadow: 0 8px 24px rgba(20,20,25,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-color: var(--line-2) transparent; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 620px; margin: 0 auto; padding: 0 16px 60px; position: relative; z-index: 1; }

.hero {
  background: linear-gradient(180deg, #ff7a1a 0%, #ff3d68 78%, #ff1f5d 100%);
  border-radius: 0 0 26px 26px;
  color: #fff; padding: 14px 16px 18px; margin-bottom: 18px;
}
.hero-top { display: flex; align-items: center; gap: 10px; }
.hero-logo { display: flex; align-items: center; gap: 11px; min-width: 0; }
.m-badge {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  background: #fff; color: #ff1f5d;
  display: flex; align-items: center; justify-content: center;
  font-size: 21px; font-weight: 800;
}
.hero-brand { font-size: 16px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
.hero-sub { color: rgba(255,255,255,.85); font-size: 12px; margin-top: 1px; }

.coupon {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  overflow: hidden; box-shadow: var(--shadow);
}
.coupon-img {
  width: 100%; height: 180px; object-fit: contain;
  background: linear-gradient(180deg, #fff 0%, #fff7f3 100%);
  border-bottom: 1px dashed var(--line-2); display: block; padding: 18px;
}
.coupon-body { padding: 16px 18px 18px; }
.coupon-title { font-size: 17px; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; }
.coupon-sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }

.discount-tag {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
  background: var(--brand); color: #fff; border-radius: 10px;
  padding: 6px 12px; font-size: 12px; font-weight: 800;
}
.discount-tag .big { font-size: 15px; }

.barcode-box {
  margin-top: 16px; padding: 14px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.barcode-code {
  font-size: 14px; font-weight: 800; letter-spacing: 3px;
  font-family: 'Manrope', monospace; user-select: all;
}
.barcode-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.code-chip {
  margin-top: 16px; text-align: center;
  background: var(--brand-soft); color: var(--brand); border: 1px dashed var(--brand);
  border-radius: 12px; padding: 12px; font-weight: 800; font-size: 16px; letter-spacing: 2px;
  user-select: all;
}
.copy-btn {
  margin-top: 10px; width: 100%; border: none; cursor: pointer;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line-2);
  border-radius: 12px; padding: 11px; font-family: inherit; font-weight: 700; font-size: 13px;
  transition: background .15s, transform .12s;
}
.copy-btn:active { transform: scale(.98); }

.validity {
  margin-top: 14px; display: flex; align-items: center; gap: 8px;
  color: var(--muted); font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
}
.validity b { color: var(--text); }

.section { margin-top: 14px; }
.section h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin-bottom: 8px; font-weight: 800;
}
.desc {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px; font-size: 13px; line-height: 1.6; color: var(--text);
  box-shadow: var(--shadow);
}
.desc ul { margin: 6px 0 0 0; padding-left: 18px; list-style: none; }
.desc ul li { position: relative; padding-left: 12px; margin-bottom: 5px; }
.desc ul li::before { content: ''; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
.desc a { color: var(--brand); }
.desc p { margin: 4px 0; }

.state-invalid {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow); padding: 34px 24px 40px; text-align: center;
}
.state-invalid .nf-code { font-size: 74px; font-weight: 800; color: var(--line-2); line-height: 1; letter-spacing: -.02em; }
.state-invalid .nf-img { width: 220px; max-width: 70%; border-radius: 16px; margin-top: 14px; display: block; margin-left: auto; margin-right: auto; box-shadow: var(--shadow); }
.state-invalid .big { font-size: 30px; margin-top: 10px; }
.state-invalid h2 { font-size: 17px; font-weight: 800; margin: 12px 0 6px; }
.state-invalid p { color: var(--muted); font-size: 13px; line-height: 1.5; }

.loading { text-align: center; color: var(--muted); padding: 50px 0; }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div class="hero-logo">
      <div class="m-badge">М</div>
      <div>
        <div class="hero-brand">магнит плюс</div>
        <div class="hero-sub" id="heroSub">Купон</div>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="page">

{% if invalid %}
  <div class="state-invalid">
    <div class="nf-code">404</div>
    <img class="nf-img" src="/static/404-coupon.png" alt="Купон недоступен">
    <h2>Купон недоступен</h2>
    <p>Ссылка недействительна, отозвана или срок её действия истёк.<br>Запросите новую ссылку у администратора.</p>
  </div>
{% else %}
  <div class="loading" id="loading">Загружаем купон…</div>
  <div id="content"></div>
{% endif %}

</main>

<script>
{% if invalid %}
document.getElementById('heroSub').textContent = 'Купон недоступен';
{% else %}
(function() {
  const TOKEN = location.pathname.split('/').pop();

  const C128 = (function() {
    var P = "11011001100 11001101100 11001100110 10010011000 10010001100 10001001100 10011001000 10011000100 10001100100 11001001000 11001000100 11000100100 10110011100 10011011100 10011001110 10111001100 10011101100 10011100110 11001110010 11001011100 11001001110 11011100100 11001110100 11101101110 11101001100 11100101100 11100100110 11101100100 11100110100 11100110010 11011011000 11011000110 11000110110 10100011000 10001011000 10001000110 10110001000 10001101000 10001100010 11010001000 11000101000 11000100010 10110111000 10110001110 10001101110 10111011000 10111000110 10001110110 11101110110 11010001110 11000101110 11011101000 11011100010 11011101110 11101011000 11101000110 11100010110 11101101000 11101100010 11100011010 11101111010 11001000010 11110001010 10100110000 10100001100 10010110000 10010000110 10000101100 10000100110 10110010000 10110000100 10011010000 10011000010 10000110100 10000110010 11000010010 11001010000 11110111010 11000010100 10001111010 10100111100 10010111100 10010011110 10111100100 10011110100 10011110010 11110100100 11110010100 11110010010 11011011110 11011110110 11110110110 10101111000 10100011110 10001011110 10111101000 10111100010 11110101000 11110100010 10111011110 10111101110 11101011110 11110101110 11010000100 11010010000 11010011100 1100011101011".split(" ");
    function encodeB(s) {
      var vals = [];
      for (var i = 0; i < s.length; i++) {
        var c = s.charCodeAt(i);
        if (c < 32 || c > 126) return null;
        vals.push(c - 32);
      }
      var check = 104;
      for (var j = 0; j < vals.length; j++) check += vals[j] * (j + 1);
      check %= 103;
      var bits = P[104];
      for (var k = 0; k < vals.length; k++) bits += P[vals[k]];
      bits += P[check] + P[106];
      return bits;
    }
    return {
      svg: function(s, h) {
        var bits = encodeB(s);
        if (!bits) return '';
        var mw = 2, height = h || 70, x = 0, bars = [];
        for (var i = 0; i < bits.length; i++) {
          if (bits[i] === '1') bars.push([x, mw]);
          x += mw;
        }
        var w = x;
        return '<svg viewBox="0 0 ' + w + ' ' + height + '" width="100%" height="' + height + '" preserveAspectRatio="xMidYMin meet" style="display:block">'
          + '<rect width="' + w + '" height="' + height + '" fill="#fff"/>'
          + '<g fill="#111">' + bars.map(function(b) { return '<rect x="' + b[0] + '" y="0" width="' + b[1] + '" height="' + height + '"/>'; }).join('') + '</g></svg>';
      }
    };
  })();

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function renderInvalid(msg) {
    document.getElementById('heroSub').textContent = 'Купон недоступен';
    document.getElementById('content').innerHTML =
      '<div class="state-invalid"><div class="nf-code">404</div>' +
      '<img class="nf-img" src="/static/404-coupon.png" alt="Купон недоступен">' +
      '<h2>Купон недоступен</h2><p>' + esc(msg || 'Ссылка недействительна, отозвана или срок её действия истёк. Запросите новую ссылку у администратора.') + '</p></div>';
  }
  function mdLite(src) {
    if (!src) return '';
    var lines = String(src).replace(/\r/g, '').split('\n');
    var html = '', inUl = false;
    lines.forEach(function(ln) {
      var t = ln.trim();
      if (t === '') { if (inUl) { html += '</ul>'; inUl = false; } return; }
      if (/^[*•-]\s+/.test(t)) {
        if (!inUl) { html += '<ul>'; inUl = true; }
        var item = t.replace(/^[*•-]\s+/, '');
        item = item.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        html += '<li>' + esc(item) + '</li>';
        return;
      }
      if (inUl) { html += '</ul>'; inUl = false; }
      t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      html += '<p>' + esc(t) + '</p>';
    });
    if (inUl) html += '</ul>';
    return html;
  }
  function fmtDate(v) {
    if (!v) return '';
    var d = new Date(v.indexOf('T') > -1 ? v : v + 'T00:00:00');
    if (isNaN(d)) return v;
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
  }
  function fmtDateTime(v) {
    var d = new Date(v);
    if (isNaN(d)) return v;
    return d.toLocaleString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function fmtCountdown(expiresAt) {
    var diff = new Date(expiresAt).getTime() - Date.now();
    if (diff <= 0) return 'срок действия ссылки истёк';
    var h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000);
    if (h >= 24) { var d = Math.floor(h / 24); return 'ещё ' + d + ' дн.'; }
    return 'ещё ' + h + ' ч ' + m + ' мин';
  }

  function discountText(coupon) {
    var it = (coupon.items || [])[0] || {};
    var parts = [];
    if (it.label && it.label.discountText) parts.push(it.label.discountText);
    if (coupon.subtitle) parts.push(coupon.subtitle);
    return parts.join(' · ');
  }

  function render(c, share) {
    var items = c.items || [];
    var it = items[0] || {};
    var code = it.couponCode || c.favoriteId || '';
    var isBarcode = (c.displayType === 'barcode');
    var img = c.largeImageUrl || c.promoImageUrl || c.smallImageUrl || '';
    var discount = it.discountValue ? (it.discountType === 'percentDiscount' ? '−' + it.discountValue + '%' : (it.discountType === 'pointsPromocode' ? it.discountValue + ' ₽' : '')) : '';
    var discountHtml = (discount || discountText(c))
      ? '<div class="discount-tag">' + (discount ? '<span class="big">' + esc(discount) + '</span>' : '') + '<span>' + esc(discountText(c)) + '</span></div>' : '';
    var codeBlock = isBarcode
      ? '<div class="barcode-box">' + C128.svg(code, 76) +
          '<div class="barcode-label">Штрих-код купона</div>' +
          '<div class="barcode-code">' + esc(code) + '</div></div>' +
          '<button class="copy-btn" data-copy="' + esc(code) + '">Скопировать штрих-код</button>'
      : '<div class="code-chip">' + esc(code) + '</div>' +
        '<button class="copy-btn" data-copy="' + esc(code) + '">Скопировать код</button>';
    var desc = (c.howItWorks || c.info || c.description || '').trim();
    var validity = [];
    if (c.expirationDate) validity.push('действует до ' + fmtDate(c.expirationDate));
    if (share && share.expires_at) validity.push('ссылка активна ' + fmtCountdown(share.expires_at));
    document.getElementById('heroSub').textContent = 'Купон · ' + (c.title || '');
    document.getElementById('content').innerHTML = [
      '<div class="coupon">',
      img ? '<img class="coupon-img" src="' + esc(img) + '" alt="" onerror="this.style.display=\'none\'">' : '',
      '<div class="coupon-body">',
      '<div class="coupon-title">' + esc(c.title || 'Купон') + '</div>',
      c.subtitle ? '<div class="coupon-sub">' + esc(c.subtitle) + '</div>' : '',
      discountHtml,
      codeBlock,
      validity.length ? '<div class="validity">🕐 ' + validity.join(' · <b>') + '</b></div>' : '',
      '</div></div>',
      desc ? '<div class="section"><h3>Как работает купон</h3><div class="desc">' + mdLite(desc) + '</div></div>' : ''
    ].join('');
    var copyBtn = document.querySelector('[data-copy]');
    if (copyBtn) copyBtn.addEventListener('click', function() {
      var val = copyBtn.dataset.copy;
      if (navigator.clipboard) navigator.clipboard.writeText(val);
      copyBtn.textContent = '✓ Скопировано';
      setTimeout(function() { copyBtn.textContent = 'Скопировать код'; }, 1500);
    });
  }

  fetch('/api/coupons/shares/' + encodeURIComponent(TOKEN) + '/data')
    .then(function(r) { return r.json().catch(function() { return {}; }).then(function(j) { return { ok: r.ok, j: j }; }); })
    .then(function(res) {
      if (!res.ok || !res.j.ok) {
        renderInvalid(res.j.error);
        return;
      }
      document.getElementById('loading').style.display = 'none';
      render(res.j.coupon, res.j.share);
    })
    .catch(function(e) {
      renderInvalid(e.message);
    });
})();
{% endif %}
</script>

</body>
</html>
